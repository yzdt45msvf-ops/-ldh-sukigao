<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LDH 好き顔9選</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px 14px 50px}.screen{display:none;min-height:90vh;align-items:center;justify-content:center}.active{display:flex}.panel{width:100%;text-align:center}h1{font-size:clamp(42px,10vw,76px);line-height:.92;margin:0 0 20px;font-weight:900;letter-spacing:-.05em}h2{margin:0 0 8px;font-size:28px}p{color:#aaa;line-height:1.6}.btn{border:0;background:#fff;color:#000;border-radius:999px;padding:14px 28px;font-weight:800;cursor:pointer}.bar{height:7px;background:#24242b;border-radius:9px;overflow:hidden;margin:10px 0 18px}.bar i{display:block;height:100%;background:#fff;width:0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{padding:0;border:1px solid #292930;border-radius:15px;overflow:hidden;background:#15151b;color:#fff;text-align:left;cursor:pointer}.card.sel{outline:3px solid #fff}.pic{aspect-ratio:3/4;background:linear-gradient(135deg,#292933,#101014);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#777;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:9px}.name{font-weight:800;font-size:13px}.grp{font-size:10px;color:#85858f;margin-top:4px}.duel{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:650px;margin:auto}.duel .pic{aspect-ratio:3/4}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.rank{position:absolute;background:#fff;color:#000;border-radius:99px;padding:4px 8px;font-weight:900;margin:8px}.note{font-size:11px;color:#666}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.results{gap:7px}.results .name{font-size:11px}.duel{gap:8px}}</style></head><body><div class="wrap">
<section id="s" class="screen active"><div class="panel"><h1>LDH<br>好き顔9選</h1><p>EXILEからWOLF HOWL HARMONYまで<br><b>90人</b>からあなたの好き顔BEST 9を決める。</p><button id="start" class="btn">START</button><p class="note">公式LDHプロフィールを基準にメンバーを収録。</p></div></section>
<section id="q" class="screen"><div class="panel"><h2>一次予選</h2><p id="qc"></p><div class="bar"><i id="qb"></i></div><div id="qg" class="grid"></div><p><button id="qn" class="btn" disabled>この中から1人</button></p></div></section>
<section id="f" class="screen"><div class="panel"><h2>最終選考</h2><p id="fc"></p><div class="bar"><i id="fb"></i></div><div id="dg" class="duel"></div></div></section>
<section id="r" class="screen"><div class="panel"><h2>あなたの好き顔 BEST 9</h2><div id="rg" class="results"></div><button id="again" class="btn">もう一度</button></div></section>
</div><script>
const M=[["EXILE HIRO","EXILE"],["松本利夫","EXILE"],["EXILE ÜSA","EXILE"],["EXILE MAKIDAI","EXILE"],["EXILE ATSUSHI","EXILE"],["EXILE AKIRA","EXILE"],["EXILE TAKAHIRO","EXILE"],["橘ケンチ","EXILE THE SECOND"],["EXILE TETSUYA","EXILE THE SECOND"],["EXILE NESMITH","EXILE THE SECOND"],["EXILE SHOKICHI","EXILE THE SECOND"],["EXILE NAOTO","三代目 J SOUL BROTHERS"],["小林直己","三代目 J SOUL BROTHERS"],["白濱亜嵐","GENERATIONS"],["世界","FANTASTICS"],["佐藤大樹","FANTASTICS"],["ELLY","三代目 J SOUL BROTHERS"],["山下健二郎","三代目 J SOUL BROTHERS"],["岩田剛典","三代目 J SOUL BROTHERS"],["今市隆二","三代目 J SOUL BROTHERS"],["ØMI","三代目 J SOUL BROTHERS"],["片寄涼太","GENERATIONS"],["数原龍友","GENERATIONS"],["小森隼","GENERATIONS"],["佐野玲於","GENERATIONS"],["中務裕太","GENERATIONS"],["LIKIYA","THE RAMPAGE"],["陣","THE RAMPAGE"],["RIKU","THE RAMPAGE"],["神谷健太","THE RAMPAGE"],["与那嶺瑠唯","THE RAMPAGE"],["山本彰吾","THE RAMPAGE"],["川村壱馬","THE RAMPAGE"],["吉野北人","THE RAMPAGE"],["岩谷翔吾","THE RAMPAGE"],["浦川翔平","THE RAMPAGE"],["藤原樹","THE RAMPAGE"],["武知海青","THE RAMPAGE"],["長谷川慎","THE RAMPAGE"],["龍","THE RAMPAGE"],["鈴木昂秀","THE RAMPAGE"],["後藤拓磨","THE RAMPAGE"],["澤本夏輝","FANTASTICS"],["瀬口黎弥","FANTASTICS"],["堀夏喜","FANTASTICS"],["木村慧人","FANTASTICS"],["八木勇征","FANTASTICS"],["中島颯太","FANTASTICS"],["日髙竜太","BALLISTIK BOYZ"],["加納嘉将","BALLISTIK BOYZ"],["海沼流星","BALLISTIK BOYZ"],["深堀未来","BALLISTIK BOYZ"],["奥田力也","BALLISTIK BOYZ"],["松井利樹","BALLISTIK BOYZ"],["砂田将宏","BALLISTIK BOYZ"],["剣","PSYCHIC FEVER"],["中西椋雅","PSYCHIC FEVER"],["渡邉廉","PSYCHIC FEVER"],["JIMMY","PSYCHIC FEVER"],["小波津志","PSYCHIC FEVER"],["半田龍臣","PSYCHIC FEVER"],["WEESA","PSYCHIC FEVER"],["岩城星那","LIL LEAGUE"],["中村竜大","LIL LEAGUE"],["山田晃大","LIL LEAGUE"],["岡尾真虎","LIL LEAGUE"],["百田隼麻","LIL LEAGUE"],["難波碧空","LIL LEAGUE"],["夫松健介","KID PHENOMENON"],["遠藤翼空","KID PHENOMENON"],["岡尾琥珀","KID PHENOMENON"],["川口蒼真","KID PHENOMENON"],["佐藤峻乃介","KID PHENOMENON"],["山本光汰","KID PHENOMENON"],["鈴木瑠偉","KID PHENOMENON"],["YUHI","THE JET BOY BANGERZ"],["AERON","THE JET BOY BANGERZ"],["KOTA","THE JET BOY BANGERZ"],["SHOW","THE JET BOY BANGERZ"],["TAKUMI","THE JET BOY BANGERZ"],["HINATA","THE JET BOY BANGERZ"],["TAKI","THE JET BOY BANGERZ"],["NOSUKE","THE JET BOY BANGERZ"],["SHIGETORA","THE JET BOY BANGERZ"],["AOI","THE JET BOY BANGERZ"],["RYOJI","WOLF HOWL HARMONY"],["SUZUKI","WOLF HOWL HARMONY"],["GHEE","WOLF HOWL HARMONY"],["HIROTO","WOLF HOWL HARMONY"]],I={"EXILE HIRO":"https://ldhco-public.s3.ap-northeast-1.amazonaws.com/management/img_person/123/person_main_img.jpg?1718345577=","EXILE ÜSA":"https://ldhco-public.s3.ap-northeast-1.amazonaws.com/management/img_person/126/person_main_img.jpg?1770689722=","EXILE MAKIDAI":"https://ldhco-public.s3.ap-northeast-1.amazonaws.com/management/img_person/242/person_main_img.jpg?1784706874=","EXILE TAKAHIRO":"https://ldhco-public.s3.ap-northeast-1.amazonaws.com/management/img_person/130/person_main_img.jpg?1779434244=","八木勇征":"https://ldhco-public.s3.ap-northeast-1.amazonaws.com/management/img_person/282/person_main_img.jpg?1781861514="},O={"EXILE HIRO":"https://www.ldh.co.jp/management/hiro/","松本利夫":"https://www.ldh.co.jp/management/matsumoto_t/","EXILE ÜSA":"https://www.ldh.co.jp/management/usami_y/","EXILE MAKIDAI":"https://www.ldh.co.jp/management/maki_d/","EXILE ATSUSHI":"https://www.ldh.co.jp/management2/exile_atsushi/","EXILE AKIRA":"https://www.ldh.co.jp/management/akira/","EXILE TAKAHIRO":"https://www.ldh.co.jp/management/takahiro/","橘ケンチ":"https://www.ldh.co.jp/management/kenchi/","EXILE TETSUYA":"https://www.ldh.co.jp/management/tetsuya/","EXILE NESMITH":"https://www.ldh.co.jp/management/nesmith/","EXILE SHOKICHI":"https://www.ldh.co.jp/management/shokichi/","EXILE NAOTO":"https://www.ldh.co.jp/management/naoto/","小林直己":"https://www.ldh.co.jp/management/naoki/","白濱亜嵐":"https://www.ldh.co.jp/management/shirahama/","世界":"https://www.ldh.co.jp/management/sekai/","佐藤大樹":"https://www.ldh.co.jp/management/sato/","八木勇征":"https://www.ldh.co.jp/management/yagi_y/"};let rounds=[],ri=0,sel=null,fin=[],di=0,res=[];
const sh=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const show=x=>{document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(x).classList.add("active");scrollTo(0,0)};
function make(m,click){let b=document.createElement("button");b.className="card";b.type="button";let p=document.createElement("div");p.className="pic";if(I[m[0]]){let im=document.createElement("img");im.src=I[m[0]];im.referrerPolicy="no-referrer";im.onerror=()=>{im.remove();p.textContent=(m[0].match(/[一-龥ぁ-んァ-ンA-Za-z]/g)||["LD"]).slice(0,2).join("")};p.append(im)}else p.textContent=(m[0].match(/[一-龥ぁ-んァ-ンA-Za-z]/g)||["LD"]).slice(0,2).join("");let d=document.createElement("div");d.className="info";d.innerHTML='<div class="name"></div><div class="grp"></div>';d.children[0].textContent=m[0];d.children[1].textContent=m[1];b.append(p,d);b.onclick=()=>click(b,m);return b}
function start(){rounds=[];let x=sh(M);for(let i=0;i<x.length;i+=5)rounds.push(x.slice(i,i+5));ri=0;fin=[];show("q");renderQ()}
function renderQ(){sel=null;let a=rounds[ri];document.getElementById("qc").textContent=(ri+1)+" / "+rounds.length+"　5人から1人";document.getElementById("qb").style.width=(ri/rounds.length*100)+"%";let g=document.getElementById("qg");g.innerHTML="";document.getElementById("qn").disabled=true;a.forEach(m=>g.append(make(m,(b,v)=>{sel=v;g.querySelectorAll(".card").forEach(c=>c.classList.remove("sel"));b.classList.add("sel");document.getElementById("qn").disabled=false})) )}
document.getElementById("qn").onclick=()=>{if(!sel)return;fin.push(sel);ri++;if(ri<rounds.length)renderQ();else startFinal()};
function startFinal(){fin=sh(fin);di=0;res=[];show("f");renderD()}
function renderD(){let a=fin[di*2],b=fin[di*2+1];if(!b){res.push(a);return finish()}document.getElementById("fc").textContent=(di+1)+" / 9　好きな方を選択";document.getElementById("fb").style.width=(di/9*100)+"%";let g=document.getElementById("dg");g.innerHTML="";[a,b].forEach(m=>g.append(make(m,(el,v)=>{res.push(v);di++;di<9?renderD():finish()})))}
function finish(){res=res.slice(0,9);show("r");let g=document.getElementById("rg");g.innerHTML="";res.forEach((m,i)=>{let c=make(m,()=>window.open(O[m[0]]||"#","_blank","noopener"));c.style.position="relative";let r=document.createElement("span");r.className="rank";r.textContent=i+1;c.prepend(r);g.append(c)})}
document.getElementById("start").onclick=start;document.getElementById("again").onclick=start;
</script></body></html>
